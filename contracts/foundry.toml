[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

solc_version = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = false

evm_version = "paris"

gas_reports = ["*"]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
aurora_testnet = "${AURORA_TESTNET_RPC}"
aurora_mainnet = "${AURORA_MAINNET_RPC}"

[etherscan]
aurora_testnet = { key = "${AURORA_API_KEY}", url = "https://explorer.testnet.aurora.dev/api" }
